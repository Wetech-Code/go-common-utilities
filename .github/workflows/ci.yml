name: ci

# Manual only: runs when someone clicks "Run workflow" (or `gh workflow run ci.yml`).
# It never runs on push, pull request or a schedule.
# To publish, run it from main and pick a release type (auto reads the commit
# messages since the last tag). The release job works out the next version from
# the latest tag, tags that commit and creates the GitHub
# release, but only after every check and integration test below has passed.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "none = checks only. auto = pick patch/minor/major from commit messages. Or force patch/minor/major. (first release is always v0.1.0)"
        required: true
        default: none
        type: choice
        options: [none, auto, patch, minor, major]

permissions:
  contents: read

jobs:
  check:
    name: check (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.10", "1.27.3"] # go.mod minimum, and the latest tested release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go.mod is tidy and verified
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify
      - run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Independent consumer builds and runs
        run: scripts/consumer-check.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: integration (PostgreSQL, MongoDB, Redis, SeaweedFS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # disposable runner-local database, no password to leak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 10s --health-retries 12
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Start SeaweedFS with random throwaway credentials
        run: |
          access="$(openssl rand -hex 8)"
          secret="$(openssl rand -hex 16)"
          echo "::add-mask::$access"
          echo "::add-mask::$secret"
          {
            echo "GCU_TEST_S3_ENDPOINT=http://localhost:8333"
            echo "GCU_TEST_S3_ACCESS_KEY=$access"
            echo "GCU_TEST_S3_SECRET_KEY=$secret"
            echo "GCU_TEST_POSTGRES_URL=postgres://postgres@localhost:5432/postgres?sslmode=disable"
            echo "GCU_TEST_MONGODB_URI=mongodb://localhost:27017/?directConnection=true"
            echo "GCU_TEST_REDIS_URL=redis://localhost:6379/0"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/s3.json" <<JSON
          {"identities":[{"name":"ci","credentials":[{"accessKey":"$access","secretKey":"$secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 \
            -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            "$SEAWEEDFS_IMAGE" server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            if curl -s http://localhost:9333/dir/assign | grep -q '"fid"' && curl -s -o /dev/null http://localhost:8333/; then
              echo "SeaweedFS ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs seaweedfs | tail -50
          echo "SeaweedFS did not become ready" >&2
          exit 1

      - name: Record the service versions under test
        run: |
          docker ps --format '{{.Image}}' | sort
          docker exec seaweedfs weed version
          docker exec "$(docker ps -q --filter ancestor=postgres:18)" postgres --version
          docker exec "$(docker ps -q --filter ancestor=mongo:8.0)" mongod --version | head -1
          docker exec "$(docker ps -q --filter ancestor=redis:8)" redis-server --version
          go version

      - name: Integration tests
        run: |
          set -o pipefail
          go test -tags integration -race -count=1 -v -run Integration ./... 2>&1 | tee integration.log
          # A skipped test proves nothing, so any skip fails the job.
          if grep -e '--- SKIP' integration.log; then echo "integration test skipped" >&2; exit 1; fi

      - name: Independent consumer talks to every service
        run: scripts/consumer-check.sh

  # Tags and publishes. Runs no repository scripts or third-party Go code, and the
  # write token is passed only to the two steps that need it.
  release:
    name: release (${{ inputs.release }})
    if: inputs.release != 'none' && github.ref == 'refs/heads/main'
    needs: [check, vulncheck, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token is given to the push step explicitly
          fetch-depth: 0 # auto needs the commits since the last tag
      - name: Work out the next version from the latest tag
        id: next
        env:
          BUMP: ${{ inputs.release }}
        run: |
          git fetch --tags --quiet
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0" # nothing published yet
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [ "$BUMP" = auto ]; then
              if [ "$(git rev-list --count "$latest"..HEAD)" = 0 ]; then
                echo "No commits since $latest; nothing to release." >&2; exit 1
              fi
              log="$(git log "$latest"..HEAD --format='%s%n%b')"
              # Conventional commits: "type!:" or a BREAKING CHANGE footer = breaking, "feat:" = feature, anything else = fix.
              if grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<< "$log"; then BUMP=major
              elif grep -Eq '^feat(\([^)]*\))?:' <<< "$log"; then BUMP=minor
              else BUMP=patch; fi
              # Before 1.0 a breaking change is a minor bump; going to v1.0.0 must be chosen explicitly.
              if [ "$BUMP" = major ] && [ "$major" = 0 ]; then BUMP=minor; fi
              echo "auto picked: $BUMP"
            fi
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "$next already exists; tags are never moved." >&2; exit 1
          fi
          echo "latest tag: ${latest:-none}  ->  releasing: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Tag the commit
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION"
      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

  # Proves the new tag installs from a clean module. Read-only token, and the git
  # credential is removed before any downloaded code is built or run.
  verify-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GOPRIVATE: github.com/Wetech-Code/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Download the private module with the read-only token, then drop the token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          tmp="$(mktemp -d)"; cd "$tmp"
          go mod init example.com/prefetch
          go get "github.com/Wetech-Code/go-common-utilities@${VERSION}"   # fills the module cache
          git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf
          ! git config --global --get-regexp '^url\.' # nothing left behind
      - name: Consumer builds and runs against the cached tag
        run: CONSUMER_VERSION="$VERSION" scripts/consumer-check.sh
