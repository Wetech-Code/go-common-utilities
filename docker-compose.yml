# Disposable servers for the opt-in integration tests. Run them with
# scripts/integration.sh, which creates throwaway S3 credentials, starts these,
# runs the tests and removes everything again. Nothing here is for production.
#
# Host ports are deliberately unusual so they do not clash with servers you
# already run locally, and are bound to 127.0.0.1 only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust # throwaway local database, no password to leak
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.3
    ports: ["127.0.0.1:27117:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 3s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      # Written by scripts/integration.sh with random credentials for each run.
      - ${GCU_S3_CONFIG:?run scripts/integration.sh, which creates this file}:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"

  loki:
    image: grafana/loki:3.7.9
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:13100:3100"]
    # The image has no shell, so there is no container healthcheck;
    # scripts/integration.sh waits for http://localhost:13100/ready instead.

  grafana:
    image: grafana/grafana:12.4.14
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Random for every run; scripts/integration.sh sets it.
      GF_SECURITY_ADMIN_PASSWORD: ${GCU_GRAFANA_PASSWORD:?run scripts/integration.sh, which sets this}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    depends_on: [loki, tempo, prometheus]
    ports: ["127.0.0.1:13000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 3s
      timeout: 5s
      retries: 40

  tempo:
    image: grafana/tempo:2.9.5
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:14318:4318"   # OTLP/HTTP in
      - "127.0.0.1:13200:3200"   # query API
    # No shell in the image, so no container healthcheck; scripts/integration.sh
    # waits for http://localhost:13200/ready.

  prometheus:
    image: prom/prometheus:v3.9.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
    ports: ["127.0.0.1:19090:9090"]
