# Disposable servers for the opt-in integration tests. Run them with
# scripts/integration.sh, which creates throwaway S3 credentials, starts these,
# runs the tests and removes everything again. Nothing here is for production.
#
# Host ports are deliberately unusual so they do not clash with servers you
# already run locally, and are bound to 127.0.0.1 only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust # throwaway local database, no password to leak
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.3
    ports: ["127.0.0.1:27117:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 3s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: server -dir=/data -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      # Written by scripts/integration.sh with random credentials for each run.
      - ${GCU_S3_CONFIG:?run scripts/integration.sh, which creates this file}:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
